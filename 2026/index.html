<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>2026 Happy New Year - Horse Racing</title>
        <link href="style.css" rel="stylesheet" />
    </head>
    <body>
        <h1>Happy New Year 2026 - Horse Racing</h1>

        <div id="selectionArea">
            <h2>Choose Your Horse</h2>
            <div id="horseSelection"></div>
            <button id="startRaceButton">Start Race</button>
        </div>

        <div id="raceArea" style="display: none">
            <canvas id="raceCanvas"></canvas>
            <button id="cheerButton">Cheer!</button>
        </div>

        <div id="resultsArea" style="display: none">
            <h2>Results</h2>
            <p id="winnerInfo"></p>
            <button id="playAgainButton">Play Again</button>
        </div>

        <script type="module" src="script/js/main.js"></script>
    </body>
</html>
